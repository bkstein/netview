[package]
name = "netview"
version = "0.1.0"
description = "Live view of network connections in a terminal, inspired by Mark Russinovich's tcpview."
authors = ["Bernd Krietenstein <bernd.krietenstein@gmx.de>"]
license = "MIT"
edition = "2024"
readme = "README.md"
homepage = "https://github.com/bkstein/netview"
repository = "https://github.com/bkstein/netview"

[package.metadata.deb]
maintainer = "Bernd Krietenstein <bernd.krietenstein@gmx.de>"
copyright = "Bernd Krietenstein <bernd.krietenstein@gmx.de>"
license-file = ["LICENSE", "0"]
extended-description = """\
Terminal UI that lists live TCP and UDP connections on the local machine, \
with process details, optional DNS lookup, and protocol/IP filters. \
Inspired by Mark Russinovich's TCPView."""
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/netview", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/netview/README.md", "644"],
]

[dependencies]
bytesize = "1.3"
chrono = "0.4"
color-eyre = "0.6.3"
crossterm = { version = "0.29", features = ["event-stream"] }
dns-lookup = "3"
futures = "0.3.31"
humantime = "2.1"
netstat2 = "0.11"
num_enum = "0.7"
ratatui = { version = "0.30.0" }
sysinfo = "0.37"
tokio = { version = "1.48.0", features = ["full"] }
